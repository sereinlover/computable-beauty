version: "3.9"

services:
  engine:
    build: ./apps/engine
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    volumes:
      - ./contracts:/app/contracts:ro
      - ./skills:/app/skills:ro
      - uploads:/data/uploads

  gateway:
    build: ./apps/gateway
    ports:
      - "8080:8080"
    environment:
      - ENGINE_URL=http://engine:8000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://cb:${POSTGRES_PASSWORD}@postgres:5432/computable_beauty
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    volumes:
      - uploads:/data/uploads
    depends_on:
      - engine
      - redis
      - postgres

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://gateway:8080
    depends_on:
      - gateway

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cb
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=computable_beauty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb -d computable_beauty"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uploads:
  postgres_data:
  redis_data:
