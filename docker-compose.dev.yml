# Local dev: only postgres + redis run in Docker; engine/gateway/web run
# directly on the host.
#
# Usage: docker compose -f docker-compose.dev.yml up -d postgres redis

name: computable-beauty-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file: .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Hardcoded cb/computable_beauty, not ${POSTGRES_USER}/${POSTGRES_DB}:
    # Compose substitutes ${VAR} from a literal ".env" file regardless of
    # env_file, which isn't .env.local (the file this actually uses).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb -d computable_beauty"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
