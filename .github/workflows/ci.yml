name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/gateway/go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: go install golang.org/x/tools/cmd/goimports@latest
      - run: make lint-ci
      - run: make test

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      # madmom (chord/signature) shells out to ffmpeg for mp3 decoding —
      # unlike soundfile/librosa, it doesn't bundle its own decoder.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/engine/pyproject.toml
      - run: uv sync
      # genre/instrument/emotion classifiers load these at test time — not
      # committed to the repo (see Makefile's `models` target).
      - run: make models
      - run: make lint-ci
      - run: make test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: make lint-ci

  # Builds and pushes engine/gateway/web images to ghcr.io — only after all
  # three lint-ci/test jobs above pass, and only on an actual push to main
  # (not on pull_request runs). deploy-pull.sh pulls these instead of
  # building locally; see docker-compose.pull.yml.
  publish:
    needs: [gateway, engine, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          # engine: essentia-tensorflow (genre/instrument/emotion
          # classifiers) has no Linux aarch64 wheel on PyPI as of this
          # writing — amd64-only until that changes or we build our own
          # arm64 wheel. docker-compose.base.yml pins the engine service to
          # linux/amd64 unconditionally, so both deploy-build.sh and
          # deploy-pull.sh run it under emulation on Apple Silicon.
          - service: engine
            platforms: linux/amd64
          - service: gateway
            platforms: linux/amd64,linux/arm64
          - service: web
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/computable-beauty-${{ matrix.service }}:latest
